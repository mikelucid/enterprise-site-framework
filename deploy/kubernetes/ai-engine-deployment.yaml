apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: enterprise-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
      - name: ai-engine
        image: yourorg/enterprise-framework:latest
