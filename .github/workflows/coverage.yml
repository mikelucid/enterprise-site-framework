name: coverage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
